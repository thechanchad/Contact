<style>
    :root {
        --cream: #FAF7F0;
        --charcoal: #1A1A1A;
        --sage: #7D8F69;
        --terracotta: #C65D3B;
        --gold: #D4AF37;
        --shadow: rgba(0, 0, 0, 0.08);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'DM Sans', sans-serif;
        background: var(--cream);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
    }

    /* Organic background texture */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
            radial-gradient(circle at 20% 80%, rgba(125, 143, 105, 0.06) 0%, transparent 50%),
            radial-gradient(circle at 80% 20%, rgba(198, 93, 59, 0.04) 0%, transparent 50%),
            radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
    }

    /* Grain overlay for texture */
    body::after {
        content: '';
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 1;
        animation: grain 8s steps(10) infinite;
    }

    @keyframes grain {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-5%, -10%); }
        20% { transform: translate(-15%, 5%); }
        30% { transform: translate(7%, -25%); }
        40% { transform: translate(-5%, 25%); }
        50% { transform: translate(-15%, 10%); }
        60% { transform: translate(15%, 0%); }
        70% { transform: translate(0%, 15%); }
        80% { transform: translate(3%, 10%); }
        90% { transform: translate(-10%, 5%); }
    }

    .container {
        max-width: 480px;
        width: 100%;
        position: relative;
        z-index: 2;
        animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(60px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .card {
        background: white;
        border-radius: 0;
        box-shadow: 
            0 1px 2px rgba(0, 0, 0, 0.04),
            0 8px 24px var(--shadow),
            0 24px 48px rgba(0, 0, 0, 0.06);
        overflow: hidden;
        position: relative;
    }

    /* Decorative border */
    .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, var(--sage), var(--terracotta), var(--gold));
        z-index: 10;
    }

    .profile-section {
        padding: 56px 40px 48px;
        background: linear-gradient(135deg, #F8F6F1 0%, #FFFFFF 100%);
        text-align: center;
        position: relative;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    /* Decorative accent behind photo */
    .profile-section::before {
        content: '';
        position: absolute;
        top: 32px;
        left: 50%;
        transform: translateX(-50%);
        width: 170px;
        height: 170px;
        background: linear-gradient(135deg, var(--sage), var(--terracotta));
        opacity: 0.08;
        border-radius: 50%;
        animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(1.05); }
    }

    .photo-frame {
        position: relative;
        width: 160px;
        height: 160px;
        margin: 0 auto 32px;
        z-index: 2;
    }

    /* Rotating decorative ring */
    .photo-frame::before {
        content: '';
        position: absolute;
        top: -8px;
        left: -8px;
        width: calc(100% + 16px);
        height: calc(100% + 16px);
        border: 2px solid var(--gold);
        border-radius: 50%;
        opacity: 0.3;
        animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .photo-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        border: 6px solid white;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .photo-frame:hover img {
        transform: scale(1.05);
    }

    h1 {
        font-family: 'Playfair Display', serif;
        font-size: 42px;
        font-weight: 900;
        color: var(--charcoal);
        margin-bottom: 12px;
        letter-spacing: -0.02em;
        line-height: 1.1;
    }

    .subtitle {
        font-size: 16px;
        color: #666;
        font-weight: 500;
        letter-spacing: 0.02em;
        line-height: 1.5;
        max-width: 340px;
        margin: 0 auto;
    }

    .actions {
        padding: 40px 40px 48px;
        background: white;
    }

    .action-link {
        display: flex;
        align-items: center;
        text-decoration: none;
        padding: 20px 24px;
        margin-bottom: 12px;
        border-radius: 0;
        background: white;
        border: 1.5px solid rgba(0, 0, 0, 0.1);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    .action-link:nth-child(1) { animation-delay: 0.1s; }
    .action-link:nth-child(2) { animation-delay: 0.2s; }
    .action-link:nth-child(3) { animation-delay: 0.3s; }
    .action-link:nth-child(4) { animation-delay: 0.4s; }
    .action-link:nth-child(5) { animation-delay: 0.5s; }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateX(-40px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    .action-link::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 100%;
        background: var(--charcoal);
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 0;
    }

    .action-link:hover::before {
        width: 100%;
    }

    .action-link:hover {
        border-color: var(--charcoal);
        transform: translateX(8px);
        box-shadow: -8px 8px 0 var(--gold);
    }

    .action-icon {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        margin-right: 20px;
        border-radius: 50%;
        flex-shrink: 0;
        position: relative;
        z-index: 1;
        transition: transform 0.3s ease;
    }

    .action-link:hover .action-icon {
        transform: scale(1.15) rotate(12deg);
    }

    .action-content {
        flex-grow: 1;
        position: relative;
        z-index: 1;
    }

    .action-title {
        font-weight: 700;
        font-size: 16px;
        color: var(--charcoal);
        margin-bottom: 2px;
        transition: color 0.3s ease;
    }

    .action-link:hover .action-title {
        color: white;
    }

    .action-desc {
        font-size: 13px;
        color: #888;
        transition: color 0.3s ease;
    }

    .action-link:hover .action-desc {
        color: rgba(255, 255, 255, 0.8);
    }

    .action-arrow {
        font-size: 18px;
        color: var(--charcoal);
        position: relative;
        z-index: 1;
        transition: all 0.3s ease;
    }

    .action-link:hover .action-arrow {
        color: white;
        transform: translateX(4px);
    }

    /* Color variants for icons */
    .icon-call { background: rgba(125, 143, 105, 0.1); color: var(--sage); }
    .icon-whatsapp { background: rgba(37, 211, 102, 0.1); color: #25D366; }
    .icon-email { background: rgba(198, 93, 59, 0.1); color: var(--terracotta); }
    .icon-linkedin { background: rgba(10, 102, 194, 0.1); color: #0A66C2; }
    .icon-save { background: rgba(212, 175, 55, 0.1); color: var(--gold); }

    .divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.08), transparent);
        margin: 32px 0;
    }

    .save-link {
        background: linear-gradient(135deg, var(--charcoal), #2A2A2A);
        border: none;
        margin-bottom: 0;
    }

    .save-link::before {
        background: var(--gold);
    }

    .save-link .action-icon {
        background: rgba(212, 175, 55, 0.2);
        color: var(--gold);
    }

    .save-link .action-title,
    .save-link .action-desc,
    .save-link .action-arrow {
        color: white;
    }

    .save-link:hover {
        box-shadow: -8px 8px 0 var(--sage);
    }

    footer {
        margin-top: 32px;
        text-align: center;
        font-size: 13px;
        color: #999;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-weight: 500;
        animation: fadeIn 1s ease 0.8s backwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 560px) {
        .container {
            max-width: 100%;
        }

        .profile-section {
            padding: 48px 24px 40px;
        }

        h1 {
            font-size: 36px;
        }

        .subtitle {
            font-size: 15px;
        }

        .actions {
            padding: 32px 24px 40px;
        }

        .action-link {
            padding: 18px 20px;
        }

        .action-link:hover {
            transform: translateX(4px);
            box-shadow: -6px 6px 0 var(--gold);
        }

        .save-link:hover {
            box-shadow: -6px 6px 0 var(--sage);
        }
    }
</style>
